<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  background:#111;
  color:#eee;
  font-family:Arial,sans-serif;
}

body{
  padding:32px;
}

header{
  position:sticky;
  top:0;
  z-index:10;

  padding:18px 0 26px;

  background:#111;
}

h1{
  margin:0;
  font-size:14px;
  line-height:1;
  font-weight:500;
}

.grid{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:28px 18px;
}

figure{
  margin:0;
  min-width:0;
}

img{
  display:block;
  width:100%;
  height:auto;

  aspect-ratio:4/5;
  object-fit:contain;

  background:#1d1d1d;
}

figcaption{
  margin-top:8px;

  font-size:11px;
  line-height:1.3;

  color:#929292;
}

@media(max-width:1000px){
  .grid{
    grid-template-columns:repeat(3,minmax(0,1fr));
  }
}

@media(max-width:600px){
  body{
    padding:18px;
  }

  .grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
}
</style>
</head>
